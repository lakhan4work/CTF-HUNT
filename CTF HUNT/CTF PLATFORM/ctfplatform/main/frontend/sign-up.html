<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CTF HUNT | Sign Up</title>
  <link rel="stylesheet" href="assets/styles/main.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-layout {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      padding: var(--space-xl);
    }

    .auth-container {
      width: 100%;
      max-width: 520px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      position: relative;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-light), var(--accent-primary));
    }

    .auth-header {
      text-align: center;
      padding: var(--space-4xl) var(--space-3xl) var(--space-2xl);
      background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-tertiary) 100%);
    }

    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
    }

    .auth-brand-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-light));
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-3xl);
      box-shadow: var(--shadow-lg);
    }

    .auth-title {
      font-size: var(--font-size-3xl);
      margin-bottom: var(--space-sm);
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: var(--font-size-base);
    }

    .auth-body {
      padding: var(--space-3xl);
    }

    .form-floating {
      position: relative;
      margin-bottom: var(--space-xl);
    }

    .form-floating input {
      width: 100%;
      padding: var(--space-lg) var(--space-lg);
      background: var(--bg-tertiary);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-size: var(--font-size-base);
      transition: all var(--transition-base);
    }

    .form-floating input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 4px rgba(66, 153, 225, 0.1);
      background: var(--bg-secondary);
    }

    .form-floating label {
      position: absolute;
      top: 50%;
      left: var(--space-lg);
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      transition: all var(--transition-base);
      font-weight: 500;
    }

    .form-floating input:focus + label,
    .form-floating input:not(:placeholder-shown) + label {
      top: var(--space-sm);
      transform: translateY(0);
      font-size: var(--font-size-sm);
      color: var(--accent-primary);
    }

    .password-strength {
      margin-top: var(--space-sm);
      height: 4px;
      background: var(--border-light);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      width: 0%;
      transition: all var(--transition-base);
      border-radius: var(--radius-sm);
    }

    .password-strength.weak .password-strength-bar {
      width: 33%;
      background: var(--danger);
    }

    .password-strength.medium .password-strength-bar {
      width: 66%;
      background: var(--warning);
    }

    .password-strength.strong .password-strength-bar {
      width: 100%;
      background: var(--success);
    }

    .auth-footer {
      padding: var(--space-2xl) var(--space-3xl) var(--space-3xl);
      text-align: center;
      border-top: 1px solid var(--border-light);
      background: var(--bg-tertiary);
    }

    .auth-footer p {
      color: var(--text-muted);
      margin: 0;
    }

    .auth-footer a {
      color: var(--accent-primary);
      font-weight: 600;
      transition: color var(--transition-fast);
    }

    .auth-footer a:hover {
      color: var(--accent-light);
    }
  </style>
</head>
<body>
<div class="auth-layout">
  <div class="auth-container">
    <div class="auth-header">
      <div class="ctf-brand">
  <img src="assets/styles/ctflogo.png" alt="CTF Hunt Logo" />
  <span class="ctf-brand-text">CTF HUNT</span>
</div>

      <h1 class="auth-title">Join the CTF</h1>
      <p class="auth-subtitle">Create your account and start hacking</p>
    </div>

    <div class="auth-body">
      <form id="signupForm">
        <div class="form-floating">
          <input type="text" id="username" name="username" placeholder=" " minlength="3" maxlength="20" required/>
          <label for="username">👤 Username</label>
        </div>

        <div class="form-floating">
          <input type="email" id="email" name="email" placeholder=" " required/>
          <label for="email">📧 Email Address</label>
        </div>

        <div class="form-floating">
          <input type="password" id="password" name="password" placeholder=" " minlength="8" required/>
          <label for="password">🔒 Password</label>
          <div class="password-strength" id="passwordStrength">
            <div class="password-strength-bar"></div>
          </div>
        </div>

        <button type="submit" id="signupBtn" class="button">
          🚀 Create Account
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <p>Already have an account? <a href="login.html">Sign in here</a></p>
    </div>
  </div>
</div>

<script>
// Enhanced signup functionality with proper error handling
document.addEventListener("DOMContentLoaded", () => {
  console.log("Sign-up page loaded, initializing...");
  
  // Initialize form handler
  const signupForm = document.querySelector("#signupForm");
  if (signupForm) {
    signupForm.addEventListener("submit", handleSignup);
  }
  
  // Initialize validation handlers
  const usernameInput = document.querySelector("#username");
  const emailInput = document.querySelector("#email");
  const passwordInput = document.querySelector("#password");
  
  if (usernameInput) {
    usernameInput.addEventListener("blur", validateUsername);
  }
  
  if (emailInput) {
    emailInput.addEventListener("blur", validateEmail);
  }
  
  if (passwordInput) {
    passwordInput.addEventListener("input", validatePassword);
  }
  
  // Add shake animation styles
  const shakeCSS = `
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
  `;
  const style = document.createElement('style');
  style.textContent = shakeCSS;
  document.head.appendChild(style);
});

async function handleSignup(e) {
  e.preventDefault();

  const signupBtn = document.querySelector("#signupBtn");
  const usernameInput = document.querySelector("#username");
  const emailInput = document.querySelector("#email");
  const passwordInput = document.querySelector("#password");
  
  if (!signupBtn || !usernameInput || !emailInput || !passwordInput) {
    console.error("Required form elements not found");
    return;
  }
  
  const username = usernameInput.value.trim();
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  // Validation
  if (!username || !email || !password) {
    showToast("Please fill in all fields", "error");
    return;
  }

  if (username.length < 3) {
    showToast("Username must be at least 3 characters", "error");
    return;
  }

  if (password.length < 8) {
    showToast("Password must be at least 8 characters", "error");
    return;
  }

  // Loading state
  signupBtn.classList.add("loading");
  signupBtn.textContent = "Creating account...";
  signupBtn.disabled = true;

  try {
    const response = await fetch("http://localhost:8000/sign-up/sign-up", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, email, password }),
    });

    const data = await response.json();
    console.log("Signup response:", data);

    if (response.ok) {
      showToast("Account created successfully! Welcome to CTF HUNT! 🎉", "success");
      
      // Redirect to login after success
      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    } else {
      throw new Error(data.message || "Registration failed");
    }
  } catch (err) {
    console.error("Signup error:", err);
    showToast(`Registration failed: ${err.message}`, "error");
    
    // Reset button state
    signupBtn.classList.remove("loading");
    signupBtn.textContent = "🚀 Create Account";
    signupBtn.disabled = false;
    
    // Add shake animation to form
    const authContainer = document.querySelector(".auth-container");
    if (authContainer) {
      authContainer.style.animation = "shake 0.5s ease-in-out";
      setTimeout(() => {
        authContainer.style.animation = "";
      }, 500);
    }
  }
}

// Username validation
function validateUsername() {
  const usernameInput = document.querySelector("#username");
  if (!usernameInput) return;
  
  if (usernameInput.value.length > 0 && usernameInput.value.length < 3) {
    usernameInput.style.borderColor = "var(--danger)";
    showToast("Username must be at least 3 characters", "error");
  } else if (usernameInput.value.length >= 3) {
    usernameInput.style.borderColor = "var(--success)";
  } else {
    usernameInput.style.borderColor = "var(--border-light)";
  }
}

// Email validation
function validateEmail() {
  const emailInput = document.querySelector("#email");
  if (!emailInput) return;
  
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (emailInput.value && !emailRegex.test(emailInput.value)) {
    emailInput.style.borderColor = "var(--danger)";
    showToast("Please enter a valid email address", "error");
  } else if (emailInput.value) {
    emailInput.style.borderColor = "var(--success)";
  } else {
    emailInput.style.borderColor = "var(--border-light)";
  }
}

// Password validation and strength indicator
function validatePassword() {
  const passwordInput = document.querySelector("#password");
  const strengthIndicator = document.querySelector("#passwordStrength");
  
  if (!passwordInput || !strengthIndicator) return;
  
  const password = passwordInput.value;
  let strength = 0;
  
  // Length check
  if (password.length >= 8) strength++;
  
  // Contains numbers
  if (/\d/.test(password)) strength++;
  
  // Contains lowercase and uppercase
  if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
  
  // Contains special characters
  if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
  
  // Update visual indicator
  strengthIndicator.className = "password-strength";
  
  if (strength >= 4) {
    strengthIndicator.classList.add("strong");
    passwordInput.style.borderColor = "var(--success)";
  } else if (strength >= 2) {
    strengthIndicator.classList.add("medium");
    passwordInput.style.borderColor = "var(--warning)";
  } else if (strength >= 1) {
    strengthIndicator.classList.add("weak");
    passwordInput.style.borderColor = "var(--danger)";
  } else {
    passwordInput.style.borderColor = "var(--border-light)";
  }
}

// Toast notification function
function showToast(message, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast ${type} show`;
  toast.innerHTML = `
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <span>${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span>
      <span>${message}</span>
    </div>
  `;
  
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => document.body.removeChild(toast), 300);
  }, 3000);
}

// Add shake animation styles
const shakeCSS = `
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
`;
const style = document.createElement('style');
style.textContent = shakeCSS;
document.head.appendChild(style);
</script>
</body>
</html>
