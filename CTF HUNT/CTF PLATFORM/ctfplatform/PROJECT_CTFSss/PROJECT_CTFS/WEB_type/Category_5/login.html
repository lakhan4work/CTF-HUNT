<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; }
        #flag-container { border: 1px solid red; padding: 20px; background-color: #ffe0e0; }
    </style>
</head>
<body>
    <h1>Admin Login</h1>

    <form id="loginForm">
        <input type="text" placeholder="Username" required><br><br>
        <input type="password" placeholder="Password" required><br><br>

        <button id="submitBtn" disabled>Login (Admin Only)</button>
    </form>

    <p>You must be an admin to click this button. It's disabled for everyone else!</p>

    <div id="flag-container" style="display:none;">
        The Flag is: <strong>flag{cl1ent_s1de_l0g1c_1s_n0t_s3cur3}</strong>
    </div>

    <script>
        // A simple script that doesn't actually do anything, just for show
        document.getElementById('submitBtn').onclick = function() {
            alert("Only a true Admin can click me!");
        };
    </script>
</body>
</html>
